<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of the app icon. Regenerate the PNGs with `npm run icons`. Same template as Simple Docs and Simple Cell. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f5a"/>
      <stop offset=".5" stop-color="#e8662a"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fdf1ea"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f58a47"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-20%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30" result="b"/>
      <feOffset in="b" dy="36" result="o"/>
      <feFlood flood-color="#2e0f04" flood-opacity=".5"/>
      <feComposite in2="o" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile, top sheen, faint inner edge -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>
  <rect x="65" y="65" width="894" height="894" rx="199" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <!-- a card with three ascending bars and a trend line ending in a data point -->
  <rect x="224" y="232" width="576" height="560" rx="52" fill="url(#paper)" filter="url(#lift)"/>
  <path d="M308 556a20 20 0 0 1 20-20H392a20 20 0 0 1 20 20V696H308ZM460 460a20 20 0 0 1 20-20H544a20 20 0 0 1 20 20V696H460ZM612 356a20 20 0 0 1 20-20H696a20 20 0 0 1 20 20V696H612Z" fill="url(#bar)"/>
  <path d="M360 482L512 392L664 290" fill="none" stroke="#7c2d12" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="664" cy="290" r="34" fill="#fff" stroke="#7c2d12" stroke-width="18"/>
</svg>
